<!doctype html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>閉じない宇宙 / An Unclosed Universe</title>
 </head>
 <body>
  <div id="app">
   <canvas id="universe"></canvas>
   <section id="opening-credits" aria-hidden="true">
    <div class="credit-heading">The Hat aperiodic monotile</div>
    <div class="credit-label">Discovered and studied by</div>
    <div class="credit-names">David Smith<br>Joseph Samuel Myers<br>Craig S. Kaplan<br>Chaim Goodman-Strauss</div>
    <div class="credit-paper"><cite>An aperiodic monotile</cite><br>Combinatorial Theory 4(1), 2024</div>
   </section>
   <div id="hud">
    <div class="title" id="title-block"><span>閉じない宇宙</span><span class="title-en">An Unclosed Universe</span></div>
    <div id="hat-count">Hat 1枚</div>
    <div class="controls" id="controls"><button id="undo">Undo</button><button id="reset">Reset</button><button id="sound">音 ♪</button></div>
    <div id="message">Hatをドラッグして、宇宙をひらく</div>
   </div>
   <div id="reset-overlay" hidden>
    <div class="reset-dialog" role="dialog" aria-modal="true" aria-labelledby="reset-title" aria-describedby="reset-description">
     <h2 id="reset-title">最初からやり直しますか？</h2>
     <p id="reset-description">現在の進行状況とUndo履歴は失われます。<br>音量などの設定は保持されます。</p>
     <div class="reset-actions"><button id="reset-cancel">キャンセル</button><button id="reset-confirm">最初から始める</button></div>
    </div>
   </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
 </body>
</html>
